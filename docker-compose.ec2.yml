services:
  backend:
    build:
      context: ./backend
    container_name: amazonhackon-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      API_V1_PREFIX: /api/v1
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GOOGLE_REDIRECT_URI: ${PUBLIC_BASE_URL}/api/v1/integrations/google/callback
    ports:
      - "8000:8000"
    volumes:
      - backend_app_data:/app/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CAMPUSBUDDY_API_BASE_URL: ${NEXT_PUBLIC_CAMPUSBUDDY_API_BASE_URL}
    container_name: amazonhackon-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_CAMPUSBUDDY_API_BASE_URL: ${NEXT_PUBLIC_CAMPUSBUDDY_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_app_data:
