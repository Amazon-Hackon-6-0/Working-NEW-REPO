services:
  backend:
    build:
      context: ./backend
    container_name: amazonhackon-backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/api/v1/integrations/google/callback
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    container_name: amazonhackon-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_CAMPUSBUDDY_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
    depends_on:
      - backend
